services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: bilz999
      MYSQL_DATABASE: hms
    ports:
      - "3306:3306"
    volumes:
      - hms-data:/var/lib/mysql
      - ./database/hospital_db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbilz999"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: hms
      DB_USER: root
      DB_PASSWORD: bilz999
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  hms-data:
